<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1% lebih baik tiap hari — 37× lipat setahun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #171717;
      --ink: #f3efe6;
      --muted: rgba(243, 239, 230, .58);
      --orange: #e39b3d;
      --orange-soft: #c8893a;
      --gray-line: #8a8680;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #0b0b0b;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .stage {
      width: 1920px;
      height: 1080px;
      position: absolute;
      left: 50%;
      top: 50%;
      overflow: hidden;
      background:
        radial-gradient(1200px 700px at 28% 18%, rgba(227, 155, 61, .07), transparent 55%),
        radial-gradient(900px 600px at 88% 80%, rgba(0, 0, 0, .45), transparent 50%),
        var(--bg);
      color: var(--ink);
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.13) 1px, transparent 1.2px);
      background-size: 22px 22px;
      opacity: 0;
      mask-image: radial-gradient(ellipse at 50% 45%, #000 35%, transparent 78%);
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.42) 100%);
    }

    .layout {
      position: relative;
      z-index: 2;
      height: 100%;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      padding: 96px 92px 92px 108px;
      gap: 40px;
    }

    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 36px;
    }

    .fig {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 36px;
      opacity: 0;
      transform: translateY(10px);
    }

    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 54px;
      line-height: 1.06;
      letter-spacing: -.02em;
    }

    .line-a, .line-b {
      display: block;
      opacity: 0;
      transform: translateY(18px);
    }

    .line-a {
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .x {
      font-family: Fraunces, "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-optical-sizing: auto;
      color: var(--orange);
      font-size: 1.18em;
      display: inline-block;
      transform-origin: left center;
    }

    .body {
      margin-top: 42px;
      max-width: 560px;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 23px;
      line-height: 1.48;
      color: var(--muted);
      opacity: 0;
      transform: translateY(14px);
    }

    .chart-wrap {
      position: relative;
      align-self: center;
      height: 620px;
      opacity: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .label {
      position: absolute;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: .01em;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }

    .label.up { color: var(--orange); }
    .label.down { color: #9a9590; }

    .hud {
      position: absolute;
      left: 56px;
      top: 28px;
      font-variant-numeric: tabular-nums;
      opacity: 0;
    }

    .hud-k {
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(243,239,230,.42);
    }

    .hud-v {
      margin-top: 4px;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 34px;
      color: var(--ink);
    }

    .hud-v span { color: var(--orange); }

    .replay {
      position: absolute;
      right: 40px;
      bottom: 32px;
      z-index: 5;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.35);
      color: var(--ink);
      font: 500 13px/1 Inter, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
    }

    .replay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .replay:hover { border-color: var(--orange); color: var(--orange); }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage" id="stage">
      <div class="grid" id="grid"></div>
      <div class="layout">
        <div class="copy">
          <p class="fig" id="fig">— FIG. 02 · Kenapa harus disiplin</p>
          <h1>
            <span class="line-a" id="lineA">1% lebih baik tiap hari =</span>
            <span class="line-b" id="lineB"><span class="x" id="xVal">37×</span> lipat setahun</span>
          </h1>
          <p class="body" id="body">1% lebih malas tiap hari, hasilnya mendekati nol dalam setahun. Disiplin bukan soal kejadian heroik sekali — itu bunga majemuk dari kebiasaan kecil yang diulang.</p>
        </div>
        <div class="chart-wrap" id="chartWrap">
          <div class="hud" id="hud">
            <div class="hud-k" id="hudK">Hari ke-0</div>
            <div class="hud-v"><span id="hudV">1.00×</span></div>
          </div>
          <canvas id="chart"></canvas>
          <div class="label up" id="labUp">+1%/hari</div>
          <div class="label down" id="labDown">−1%/hari</div>
        </div>
      </div>
      <div class="vignette"></div>
      <button class="replay" id="replay" type="button">Putar ulang</button>
    </div>
  </div>

  <script>
    const DURATION = 24;
    const isRender = /[?&]render=1\b/.test(location.search);

    const $ = (id) => document.getElementById(id);
    const stage = $("stage");
    const canvas = $("chart");
    const ctx = canvas.getContext("2d");

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const range = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
    const lerp = (a, b, u) => a + (b - a) * u;
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOut = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    function fit() {
      const s = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
    }

    function sizeCanvas() {
      const wrap = $("chartWrap");
      const dpr = isRender ? 1 : Math.min(devicePixelRatio || 1, 2);
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function layoutChart() {
      const w = $("chartWrap").clientWidth;
      const h = $("chartWrap").clientHeight;
      return {
        x0: 56,
        y0: h - 78,
        x1: w - 118,
        y1: 92,
        w: w - 174,
        h: h - 170
      };
    }

    function pointUp(u, L) {
      const days = u * 365;
      const val = Math.pow(1.01, days);
      const yNorm = (val - 1) / (Math.pow(1.01, 365) - 1);
      return {
        x: L.x0 + u * L.w,
        y: L.y0 - yNorm * L.h,
        days,
        val
      };
    }

    function pointDown(u, L) {
      const days = u * 365;
      const val = Math.pow(0.99, days);
      const drop = (1 - val) / (1 - Math.pow(0.99, 365));
      return {
        x: L.x0 + u * L.w,
        y: L.y0 + drop * L.h * 0.18,
        days,
        val
      };
    }

    function trace(progress, getPoint, L) {
      const n = 140;
      const last = Math.max(1, Math.floor(n * progress));
      ctx.beginPath();
      for (let i = 0; i <= last; i++) {
        const p = getPoint(i / n, L);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      return getPoint(last / n, L);
    }

    function drawAxes(L, a) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = "rgba(243,239,230,.22)";
      ctx.lineWidth = 1.25;
      ctx.beginPath();
      ctx.moveTo(L.x0, L.y1);
      ctx.lineTo(L.x0, L.y0);
      ctx.lineTo(L.x1, L.y0);
      ctx.stroke();
      ctx.fillStyle = "rgba(243,239,230,.38)";
      ctx.font = "500 13px Inter, sans-serif";
      ctx.fillText("0", L.x0 - 4, L.y0 + 28);
      ctx.fillText("365 hari", L.x1 - 62, L.y0 + 28);
      ctx.restore();
    }

    function placeLabel(el, p, dx, dy, opacity) {
      el.style.opacity = opacity;
      el.style.left = (p.x + dx) + "px";
      el.style.top = (p.y + dy) + "px";
    }

    function fmtMult(val) {
      if (val >= 37) return "37×";
      if (val < 10) return val.toFixed(2).replace(".", ",") + "×";
      if (val < 20) return val.toFixed(1).replace(".", ",") + "×";
      return val.toFixed(0) + "×";
    }

    function apply(el, opacity, y) {
      el.style.opacity = opacity;
      el.style.transform = "translateY(" + y + "px)";
    }

    function frame(t) {
      const L = layoutChart();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      $("grid").style.opacity = lerp(0, 0.38, easeOut(range(t, 0.05, 1.1)));

      apply($("fig"), easeOut(range(t, 0.7, 1.5)), lerp(10, 0, easeOut(range(t, 0.7, 1.5))));
      apply($("lineA"), easeOut(range(t, 1.55, 2.5)), lerp(18, 0, easeOut(range(t, 1.55, 2.5))));

      const chartIn = easeOut(range(t, 2.6, 3.6));
      $("chartWrap").style.opacity = chartIn;
      drawAxes(L, chartIn);

      const drawP = easeInOut(range(t, 3.5, 12.2));
      const downP = easeInOut(range(t, 3.8, 10.6));

      $("hud").style.opacity = range(t, 3.7, 4.4) * (1 - range(t, 11.6, 13.0));

      if (drawP > 0) {
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#8a8680";
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.9;
        const endDown = trace(downP, pointDown, L);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#e39b3d";
        ctx.shadowColor = "rgba(227,155,61,.75)";
        ctx.shadowBlur = 16;
        ctx.lineWidth = 3.2;
        const endUp = trace(drawP, pointUp, L);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.lineWidth = 2.4;
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = "#e39b3d";
        ctx.arc(endUp.x, endUp.y, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const live = pointUp(drawP, L);
        $("hudK").textContent = "Hari ke-" + Math.round(live.days);
        $("hudV").textContent = fmtMult(live.val);

        placeLabel($("labUp"), endUp, 14, -18, easeOut(range(t, 8.8, 10.4)));
        placeLabel($("labDown"), endDown, 14, 6, easeOut(range(t, 8.2, 9.8)));
      } else {
        $("labUp").style.opacity = 0;
        $("labDown").style.opacity = 0;
      }

      const punch = easeOut(range(t, 11.4, 12.8));
      const countP = easeInOut(range(t, 4.0, 12.4));
      const shown = Math.pow(1.01, countP * 365);
      const xEl = $("xVal");
      if (punch < 0.08) {
        xEl.textContent = fmtMult(shown);
      } else {
        xEl.textContent = "37×";
      }
      $("lineB").style.opacity = easeOut(range(t, 11.2, 12.6));
      $("lineB").style.transform = "translateY(" + lerp(16, 0, easeOut(range(t, 11.2, 12.6))) + "px)";
      xEl.style.transform = "scale(" + lerp(0.86, 1, punch) + ")";

      apply($("body"), easeOut(range(t, 14.0, 15.6)), lerp(14, 0, easeOut(range(t, 14.0, 15.6))));

      $("replay").classList.toggle("show", !isRender && t >= DURATION - 0.05);
    }

    let playing = !isRender;
    let start = performance.now();
    let pausedAt = 0;

    function seek(t) {
      pausedAt = clamp(t, 0, DURATION);
      frame(pausedAt);
    }

    function tick(now) {
      if (playing) {
        const t = (now - start) / 1000;
        if (t >= DURATION) {
          playing = false;
          seek(DURATION);
        } else {
          frame(t);
        }
      }
      requestAnimationFrame(tick);
    }

    function playFrom(t) {
      pausedAt = t;
      start = performance.now() - t * 1000;
      playing = true;
      $("replay").classList.remove("show");
    }

    function readyGo() {
      fit();
      sizeCanvas();
      window.ready = true;
      window.seek = seek;
      if (isRender) seek(0);
      else playFrom(0);
      requestAnimationFrame(tick);
    }

    $("replay").addEventListener("click", () => playFrom(0));
    addEventListener("resize", () => { fit(); sizeCanvas(); seek(playing ? (performance.now() - start) / 1000 : pausedAt); });

    Promise.all([
      document.fonts.ready,
      document.readyState === "complete"
        ? Promise.resolve()
        : new Promise((r) => addEventListener("load", r, { once: true }))
    ]).then(readyGo);
  </script>
</body>
</html>
